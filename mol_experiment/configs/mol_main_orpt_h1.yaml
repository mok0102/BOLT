# mol domain main experiment -- BindingDB paper-scale ORPT (matched-intervention).
# Schedule/scale mirrors peptide's own current production config
# (peptide_experiment/configs/lorarank_8_orpt_h1.yaml): init_size=1000,
# bsz=50, sft_epochs=5, milestones [126, 252, 378, 504, 630, 756, 900],
# mi_* BO-utility settings, and orpt_beta/orpt_lr.
#
# oracle_budget=5000, NOT peptide's 20000 -- explicit instruction, traded off
# against a 5-6 day turnaround target, after mol_run_bo's termination bug was
# fixed (2026-10-01): oracle_budget now means exactly what it does in
# peptide (successful BO-phase oracle calls only, via objective.num_calls,
# excluding init_size -- see config.py's own field comment and
# mol_experiment/steps.py::mol_run_bo's docstring for the full incident).
# Previously oracle_budget=20000 was silently treated as inclusive of
# init_size AND only enforced as a fixed step count, not an actual call
# count, so real per-task oracle-call totals ranged from 100% down to 18% of
# the nominal value across already-completed tasks on BOTH arms -- all data
# collected under that bug has been deleted and is being regenerated under
# the fixed loop at this new budget value.
#
# The mi_* pair-construction values (mi_num_backgrounds=8,
# mi_background_size=20, mi_z_min=1.0, mi_target_pairs_per_task=30,
# mi_max_candidates_per_task=24) were independently confirmed to transfer to
# mol's own pair-construction statistics before adopting them here (byte-
# identical algorithm; see mol_experiment/MI_ORPT_PAIR_YIELD_TUNING.md for
# the retroactive-data and live-rerun evidence) -- not copied blindly. The
# rest (orpt_beta/orpt_lr, mi_candidate_temperature/mi_candidate_pool_size,
# no task-count cap) are copied as-is per explicit instruction to mirror
# peptide's config directly; see the two caveats below for what that implies
# for mol specifically.
#
# heldout: optimization/mol/mol_tasks.py's manifest has exactly one fixed
# 50-task heldout split (N_HELDOUT_TASKS=50) -- unlike peptide's
# heldout20/50/100 tiering, mol has nothing to choose between, so no
# heldout_tasks_override is set here; MolExperimentConfig.heldout_tasks()
# already returns all 50 by default.
#
# orpt_beta=0.25/orpt_lr=2e-5: peptide's own grid-search-confirmed values,
# used here as-is per explicit instruction (not MolExperimentConfig's own
# untuned class defaults of 0.1/3e-4). Flagging once, since no mol-side DPO
# hyperparameter search has actually been run: these were tuned against
# peptide's own DPO loss landscape, and whether they're also good for mol is
# unverified, not confirmed transferable the way the mi_* values above were.
#
# Tractability caveat -- READ BEFORE LAUNCHING. Two costs stack here:
#   1. Pair construction's one-step-BO calls (mi_orpt/one_step_evaluator.py)
#      -- NOW parallelized across mi_parallel_gpus via mi_orpt/warm_pool.py
#      (one persistent worker process per GPU, verified with a real
#      multi-GPU run). At mi_max_candidates_per_task=24 * mi_num_backgrounds=8
#      = 192 calls/task, measured ~2.5s/call serially (mol_smoke_orpt
#      evidence) -> ~8 min/task serial, ~2 min/task across this config's
#      4-GPU slice, ~1 min/task once expanded to 8 (see below).
#   2. mi_candidate_temperature=1.5 (below) additionally samples a dedicated
#      ~645-candidate pool (min_bank_size_needed(20,24)*15) per task per
#      milestone via mol_sample_and_build_init -- real LLM generation +
#      real oracle scoring. NOW ALSO parallelized across mi_parallel_gpus
#      (mi_orpt/warm_sampling_pool.py, added after this comment was first
#      written -- correcting the earlier "still serial" note here). peptide's
#      own analogous plateau note (eval_raw_temperature's comment: median
#      ~305/1000 unique+feasible candidates found even after 5 retries at
#      milestone 900) suggests mol should expect a similar shortfall, not a
#      clean fill to pool_size, but the wall-clock cost of those retries is
#      real regardless of yield.
# mi_max_tasks_per_milestone is capped at 252 (see its comment further below),
# so costs 1 and 2 apply to min(m, 252) tasks per milestone (126 + 252*6 = 1638
# task-constructions in total, vs 3546 uncapped). Measured 2026-10-01 on an
# 8-task probe (milestone 30, 4 GPUs): candidate-pool sampling ~15 s/task and
# build_pairs ~103 s/task, i.e. ~118 s/task aggregate -- the older per-call
# estimates above predate that and are superseded by it. oracle_budget has no
# effect on this cost (it scales with mi_num_backgrounds/mi_max_candidates_per_task).
experiment_id: mol_main_orpt_h1
milestones: [126, 252, 378, 504, 630, 756, 900]
oracle_budget: 5000
init_size: 1000
bsz: 50
sft_epochs: 5

# GPU slice: moved to 0-3 (2026-10-01, explicit instruction) -- mol_main_bolt's
# SFT training was stopped to free this dedicated, UNSHARED slice for ORPT.
# Originally 4-7, but those GPUs are shared with another user's job (real,
# externally-owned usage, confirmed via nvidia-smi -- not ours to reclaim) with
# fluctuating free memory, which is why DPO at both batch_size=64 and 32 OOM'd
# there (close margins: needed 68GiB more at bsz64, 33.58GiB more at bsz32,
# shrinking ~linearly with batch_size but never quite fitting in whatever was
# free at that instant). 0-3 is fully dedicated, so the same batch_size has a
# fixed, predictable memory budget here. mi_parallel_gpus distributes SFT/DPO
# training and build_pairs.py's reference-model scoring across all 4;
# cuda_visible_devices pins the one-step-BO calls during pair construction
# (mi_orpt/one_step_evaluator.py -- always serial, in-process, never through
# mi_parallel_gpus, see the tractability caveat above) and
# mol_sample_and_build_init's dedicated-pool LLM sampling. Check nvidia-smi
# fresh before launching -- do not assume these ids are still free.
# UPDATE 2026-10-04: expanded to all 8 GPUs once mol_main_bolt finished (BOLT-126..900
# all done, 4-7 free). The 0-3 rationale above (dedicated slice vs shared 4-7) no
# longer applies. Global batch is held constant by the two torchtune configs
# below (SFT 32/device x 8 = 256, DPO 16/device x 8 = 128, same as the earlier
# 4 x 64 / 4 x 32 for milestones <= 504-630). Applies from the first stage run after the
# restart; milestones trained earlier on 4 GPUs are unchanged.
mi_parallel_gpus: ["0", "1", "2", "3", "4", "5", "6", "7"]
cuda_visible_devices: "0"

build_orpt: true
orpt_epochs: 1
orpt_beta: 0.25
orpt_lr: 2.0e-5
orpt_pair_source: matched_intervention
mi_num_backgrounds: 8
mi_background_size: 20
mi_tau_q: 1.0
mi_z_min: 1.0
mi_delta_t: 0.0
mi_target_pairs_per_task: 30
mi_max_candidates_per_task: 24
mi_bo_steps: 1
# mi_require_h0 left at its default (true) -- this is the H0-AND-H1 arm, matching peptide's.
mi_candidate_temperature: 1.5
mi_candidate_pool_size: 2000
# mi_max_tasks_per_milestone=252 -- DELIBERATE deviation from peptide (which is
# uncapped: every task in [0, milestone), giving 3,717 pairs at milestone 126
# up to 24,262 at 900 per runs/lorarank_8_orpt_h1/orpt_pairs). Chosen
# 2026-10-01 to fit a ~1 week compute budget: pair construction measured at
# ~118 s/task (4-GPU aggregate, one 8-task probe, so +-tens of % uncertainty)
# is the dominant cost (uncapped: ~116 h; N=252: ~54 h), while the DPO stage
# only needs "enough pairs", not pairs proportional to SFT size. With N=252
# milestone 126 is unaffected (uses all 126 tasks, ~3.2k pairs, same scale as
# peptide's), and every later milestone gets ~6.4k pairs (peptide: 7k-24k).
# Known untested risk: DPO optimizer steps stay ~50/milestone from 252 on
# (peptide's grow to ~190 at 900), so later ORPT-m may move less from BOLT-m
# than peptide's did. Tasks are a fixed-seed uniform subsample of [0, m)
# (orpt.py), not the first N. Whole-run estimate for this arm at sft_epochs=5:
# ~112 h (4.7 d): SFT ~52 h + pairs ~54 h + trajectories ~6 h + DPO <2 h.
mi_max_tasks_per_milestone: 252

# orpt_max_pair_tokens=935 -- DPO-stage length filter, added 2026-10-03 after
# ORPT-504's DPO OOM'd at step 2 (batch_size 32/device, a ~958-token padded
# batch; 143.2 GiB allocated + 34.7 GiB requested vs 178.36 GiB). Pair length is
# driven by the target protein in the prompt (corr 0.85) and DPO pads each batch
# to its longest pair. 935 = the longest pair (HF chat-template tokens) among
# ORPT-126/252/378, all of which trained fine at this batch size, so the
# filter drops nothing from those three (their max: 935/911/922) and drops 84/6663
# pairs (4 targets, protein len 820-976) at 504. DELIBERATE deviation: those
# targets are excluded from the DPO stage only (BOLT SFT still trains on them),
# and 935 is only known to fit, not known to be the true ceiling. Filtered pairs
# go to orpt_pairs_<m>_maxtok935.jsonl; the original file is never modified.
orpt_max_pair_tokens: 935

# batch_size=64/device for SFT (BOLT-<m>); DPO (ORPT-<m>) uses 32, not 64 --
# see fine-tuning/mol/torchtune_config/qwen_2_5_3B_lora_bsz64.yaml's header
# for the SFT rationale/risk flag (8x peptide's own global batch, no LR
# rescale, per explicit instruction). DPO was ALSO tried at 64 first and
# OOM'd on milestone 126 (torch.OutOfMemoryError, needed 68.32 GiB more on
# top of 142.78 GiB already in use of 178.36 GiB) -- DPO holds chosen+
# rejected sequences per example simultaneously, roughly doubling memory vs.
# SFT at the same batch_size, confirmed DPO-stage-specific since BOLT's own
# SFT-only arm ran batch_size=64 fine to task 378/900 the whole time ORPT sat
# crashed. See qwen_2_5_3B_lora_dpo_bsz32.yaml's own header for the full
# incident writeup.
# 8-GPU switch (2026-10-04): SFT bsz64 -> bsz32 (8 ranks x 32 = global 256, same as
# the earlier 4 x 64) and DPO bsz32 -> bsz16 (8 x 16 = global 128, same as 4 x 32),
# both with gradient_accumulation_steps=1. Sample sharding/order differs with
# 8 ranks, so not bit-identical to 4-GPU runs. (The comments above describe the
# original 4-GPU bsz64/bsz32 values.)
torchtune_config: qwen_2_5_3B_lora_bsz32.yaml
orpt_torchtune_config: qwen_2_5_3B_lora_dpo_bsz16.yaml

# Candidate-generation CPU sub-pool (optimization/mol/mol_generation_pool.py):
# splits each BO step's n_candidates=200 generate-and-filter call across 4
# persistent CPU worker processes per task (created once per task, reused
# across all its BO steps). Real profiling (2026-09-30) confirmed generation
# cost scales ~linearly with n_candidates and CPU headroom is enormous
# (~212/224 cores idle) -- see mol_experiment/warm_task_pool.py's own
# docstring for the task-level parallelism this stacks on top of.
generation_workers: 4
