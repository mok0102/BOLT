# Copy of synthetic_50train_20heldout_inline_example_smaller_h3.yaml (H=3) with ONLY cuda_visible_devices
# changed ("0,1" -> "6,7"), to run concurrently
# with the other Branin chains without GPU contention. Byte-identical
# otherwise. See IMPLEMENTATION_PLAN.md.
# Same experiment as synthetic_100train_20heldout_example.yaml, using inline
# YAML lists for the explicitly fixed task values.
experiment_id: synthetic_branin_50train_20heldout_mi30_composite_affine_v1_h3
milestones: [2, 5, 10, 20, 30, 40, 50]
num_train_tasks: 50
num_heldout_tasks: 20

task_manifest: synthetic_experiment/task_manifests/branin_affine_v1_seed0.json

oracle_budget: 50
init_size: 5
bsz: 10
bo_seed: 42
bo_candidate_pool_size: 128
bo_lengthscale: 0.2
bo_ucb_beta: 2.0
trajectory_parallel_workers: 2
table_k_checkpoints: [0, 1, 2, 5, 10, 20, 30, 40, 50]

proposal_source: llm
sampling_temperature: 1
sft_top_n_per_task: 20
sft_epochs: 5
torchtune_config: qwen_2_5_3B_lora.yaml
torchtune_recipe: lora_finetune_distributed
base_checkpoint_dir: fine-tuning/query_plans/ckpt/Qwen2.5-3B-Instruct
cuda_visible_devices: "6,7"

build_orpt: true
orpt_epochs: 1
orpt_beta: 0.1
orpt_lr: 1.0e-5
orpt_torchtune_config: qwen_2_5_3B_lora_dpo.yaml
orpt_torchtune_recipe: lora_dpo_distributed

mi_num_backgrounds: 3
mi_target_pairs_per_task: 30
mi_max_candidates_per_task: 30
mi_tau_q: 1.0
mi_z_min: 1.0
mi_delta_t: 0.0
mi_bo_steps: 3 # Set to k for k BO acquisition steps per MI evaluation.
mi_utility_mode: terminal_best
mi_parallel_workers: 16
mi_seed: 42
mi_bo_candidate_pool_size: 512
mi_bo_lengthscale: 0.05
mi_bo_ucb_beta: 0.0
