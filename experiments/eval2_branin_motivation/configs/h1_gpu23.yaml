# Copy of synthetic_50train_20heldout_inline_example_smaller.yaml (the main
# H=1 ORPT config) with ONLY cuda_visible_devices changed (0,1 -> 2,3), so this
# can run concurrently with the BOLT-only chain (which uses 0,1) without GPU
# contention. experiment_id/run_dir, task splits, and every BO/MI-ORPT
# parameter are byte-identical to the committed file -- not a new experiment,
# just a parallel-safe launch copy. See IMPLEMENTATION_PLAN.md.
# Same experiment as synthetic_100train_20heldout_example.yaml, using inline
# YAML lists for the explicitly fixed task values.
experiment_id: synthetic_branin_50train_20heldout_mi30_composite_v3_smaller_h1 ### v3 chosen>rejected 포함v2 ### v2 chosen>rejected 포함
milestones: [2, 5, 10, 20, 30, 40, 50]
num_train_tasks: 50
num_heldout_tasks: 20

train_task_t_override: [0.005, 0.025, 0.045, 0.065, 0.085, 0.105, 0.125, 0.145, 0.165, 0.185, 0.205, 0.225, 0.245, 0.265, 0.285, 0.305, 0.325, 0.345, 0.365, 0.385, 0.405, 0.425, 0.445, 0.465, 0.485, 0.505, 0.525, 0.545, 0.565, 0.585, 0.605, 0.625, 0.645, 0.665, 0.685, 0.705, 0.725, 0.745, 0.765, 0.785, 0.805, 0.825, 0.845, 0.865, 0.885, 0.905, 0.925, 0.945, 0.965, 0.985]
heldout_task_t_override: [0.00, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]

oracle_budget: 50
init_size: 5
bsz: 10
bo_seed: 42
bo_candidate_pool_size: 128
bo_lengthscale: 0.2
bo_ucb_beta: 2.0
trajectory_parallel_workers: 2
table_k_checkpoints: [0, 1, 2, 5, 10, 20, 30, 40, 50]

proposal_source: llm
sampling_temperature: 1
sft_top_n_per_task: 20
sft_epochs: 5
torchtune_config: qwen_2_5_3B_lora.yaml
torchtune_recipe: lora_finetune_distributed
base_checkpoint_dir: fine-tuning/query_plans/ckpt/Qwen2.5-3B-Instruct
cuda_visible_devices: "2,3"

build_orpt: true
# Optional heldout baselines; OptFormer needs train_optformer first.
build_stbo: true
build_pogpe: true
build_sgpe: true
build_mtbo: true
mtbo_top_n_per_task: 20
mtbo_max_train_points: 256
build_optformer: true
build_llambo: true
orpt_epochs: 1
orpt_beta: 0.1
orpt_lr: 1.0e-5
orpt_torchtune_config: qwen_2_5_3B_lora_dpo.yaml
orpt_torchtune_recipe: lora_dpo_distributed

mi_num_backgrounds: 3
mi_target_pairs_per_task: 30
mi_max_candidates_per_task: 30
mi_tau_q: 1.0
mi_z_min: 1.0
mi_delta_t: 0.0
mi_bo_steps: 1 # H=2, matching this run's cached MI evaluations.
mi_utility_mode: terminal_best
mi_parallel_workers: 16
mi_seed: 42
mi_bo_candidate_pool_size: 512
mi_bo_lengthscale: 0.05
mi_bo_ucb_beta: 0.0
