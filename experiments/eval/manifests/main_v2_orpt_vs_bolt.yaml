# BOLT vs ORPT-H1 vs baselines, main-experiment (paper-fidelity) scale, v2
# milestone schedule [10,20,50,250,400,500,600] -- supersedes
# main_bolt_vs_orpt_mi.yaml's [126,252,378,504,630,756,900] schedule for this
# round (see peptide_main_bolt_v2.yaml/peptide_main_orpt_h1_v2.yaml's own
# comments for why a new experiment_id/run_dir rather than editing the old
# manifest in place). Train via experiments/eval/run_main_bolt_vs_orpt_train.sh
# then run_main_baselines_train.sh (in that order) -- verify
# runs/peptide_main_bolt_v2/checkpoints/BOLT-<m> and
# runs/peptide_main_orpt_h1_v2/checkpoints/ORPT-<m> exist before assuming
# training has completed.
#
# Arm name ORPT-H1 (not ORPT-MI, per this session's H-notation-consistent
# naming convention -- see peptide_main_orpt_h1_v2.yaml's comment). Displays
# as the paper's "ORPT" in any paper-facing figure/table (see
# experiments/eval/paper_labels.py) -- this is purely an internal/checkpoint
# identifier choice, not a change to what the method is.
#
# task_set "heldout100" (100-task held-out set) for both the
# incumbent-vs-pool-size and fixed-target-BO analyses, same deliberate choice
# main_bolt_vs_orpt_mi.yaml's own comment documents (not the paper's own
# literal Table-11-vs-Figure-1/2 20-vs-100 split).
#
# STBO/MTBO/OptFormer share the real milestone axis (7 rows each). POGPE/SGPE
# overload milestone to mean n_experts (5/10/20 -- see
# gp_expert_transfer.py/fixed_target_rejection_bo.py's own POGPE/SGPE branch),
# isolated in the __gpu7 shard alongside LLAMBO (milestone-independent,
# arbitrary placeholder) -- do not plot POGPE/SGPE against the real milestone
# axis, see gpu7 shard's own comment.
