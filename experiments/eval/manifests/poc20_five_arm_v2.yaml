# 5-arm PoC comparison: BOLT (SFT-only), MTBO (shared-surrogate, DKT/FSBO-style --
# offline-trained GP surrogate, no LLM proposal policy), OptFormer (LLM-based BO
# baseline), ORPT-MI (matched-intervention DPO), and ORPT-MI-BPO (matched-intervention
# + BPO loss instead of stock DPOLoss). Each arm's own experiment_id/run_dir:
#   BOLT/MTBO/OptFormer -> runs/peptide_poc20_bolt (trained together under build_orpt/
#     build_mtbo/build_optformer flags -- see peptide_experiment/config.py)
#   ORPT-MI             -> runs/peptide_poc20_orpt_mi
#   ORPT-MI-BPO         -> runs/peptide_poc20_orpt_mi_bpo_v2 (use_pretrained_vae: false,
#     mi_candidate_temperature: 1.0 -- see peptide_poc20_orpt_mi_bpo.yaml)
#
# checkpoint_dir is only read by generate_raw_proposals.py (step 0), which skips any
# entry with no checkpoint_dir (assuming raw proposals already exist). Omitted for
# BOLT/ORPT-MI below since their raw proposals already exist under
# <run_dir>/eval_raw/heldout/<arm>-<milestone>/, and for MTBO always (it has no LLM
# checkpoint to sample from at all -- fixed_target_rejection_bo.py/
# fixed_budget_rejection_bo.py read its surrogate_state_dict.pt directly, deriving the
# path from run_dir+milestone, never from checkpoint_dir). Do not add a checkpoint_dir
# for MTBO entries -- generate_raw_proposals.py has no MTBO special-case, so a non-null
# checkpoint_dir makes it try (and fail) to LLM-sample from the surrogate's state dict.
# Re-running step 0 over the whole manifest will skip BOLT/ORPT-MI/MTBO and only
# generate the genuinely missing ones (OptFormer, ORPT-MI-BPO).
