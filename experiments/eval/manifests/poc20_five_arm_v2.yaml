  # GP-expert-transfer (POGPE/SGPE, Schilling et al. 2016): milestone here is
  # overloaded to mean expert count N (5/10/20), not a training-progress
  # checkpoint -- see peptide_experiment/gp_expert_transfer.py and
  # fixed_target_rejection_bo.py's POGPE/SGPE branch. No checkpoint_dir (no
  # LLM policy to sample raw proposals from; these arms self-seed via
  # build_mutation_init like MTBO).
  - arm: POGPE
    milestone: 5
    run_dir: runs/peptide_poc20_bolt
  - arm: POGPE
    milestone: 10
    run_dir: runs/peptide_poc20_bolt
  - arm: POGPE
