  - arm: SGPE
    milestone: 20
    run_dir: runs/peptide_poc20_bolt

  # LLAMBO (Liu et al. 2024): never fine-tuned (zero-shot, in-context only --
  # see peptide_experiment/llambo_optimization.py), so milestone is an
  # arbitrary placeholder, not a real training-progress checkpoint -- appears
  # as a single point per target_pool_size panel, not a line across
  # milestones. No checkpoint_dir (checkpoint_path=None -> the same
  # unmodified base_checkpoint_dir every other arm fine-tunes from).
  - arm: LLAMBO
    milestone: 0
    run_dir: runs/peptide_poc20_bolt
