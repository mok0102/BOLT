# Ablation Study (paper/experiments.tex sec:ablations): Supervised proposal
# (BOLT) / Zero-step outcome ranking (ORPT-H0) / One-step outcome ranking
# (ORPT-H1) -- see experiments/eval/paper_labels.py::ABLATION_ARM_TO_SIGNAL
# for the internal-arm-name -> paper-terminology mapping, and
# ABLATION_SCALE_NOTE for how this relates to the main experiment.
#
# BOLT and ORPT-H1 rows are byte-identical to main_v2_orpt_vs_bolt.yaml's own
# (same run_dir/checkpoint_dir, same milestones) -- this ablation study is
# now full main-v2 scale, not a separate PoC-sized run, so its BOLT/ORPT-H1
# eval work (raw proposals, incumbent-vs-pool-size, fixed-target BO) is
# exactly the main experiment's own; idempotency means re-running the 3-step
# eval pipeline against *this* manifest only does new work for ORPT-H0.
# ORPT-H0 is NOT yet trained anywhere (see
# peptide_experiment/configs/peptide_ablation_orpt_h0.yaml) -- train via
# experiments/eval/run_main_bolt_vs_orpt_train.sh before this manifest
# produces real ORPT-H0 numbers.
#
# task_set heldout100 (not the paper's own literal ablation-scale
# heldout20), matching the main experiment's own choice -- see this file's
# header comment above for why that reuse matters.
models:
  - arm: BOLT
    milestone: 10
    run_dir: runs/peptide_main_bolt_v2
    checkpoint_dir: runs/peptide_main_bolt_v2/checkpoints/BOLT-10/epoch_4
  - arm: BOLT
    milestone: 20
