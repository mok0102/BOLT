# Ablation Study (paper/experiments.tex sec:ablations): Supervised proposal
# (BOLT) / Zero-step outcome ranking (ORPT-H0) / One-step outcome ranking
# (ORPT-H1) -- see experiments/eval/paper_labels.py::ABLATION_ARM_TO_SIGNAL
# for the internal-arm-name -> paper-terminology mapping, and
# ABLATION_SCALE_NOTE for the PoC-scale caveat these results carry.
#
# BOLT reuses the already-completed runs/peptide_poc20_bolt_v2 (11 real
# milestone checkpoints on disk) -- no new BOLT training needed. ORPT-H0/
# ORPT-H1 are NOT yet trained anywhere (see
# peptide_experiment/configs/peptide_ablation_orpt_h{0,1}.yaml) -- this
# manifest is ready to run once that training completes.
#
# heldout_tasks_override [900..904] (5-task PoC subset, matching
# peptide_poc20_bolt_v2's own scale) -- deliberately small per the paper's
# own "do not add broad sensitivity sweeps... keep this as the main
# ablation" instruction, not the paper-fidelity 20-/100-task held-out sets.
models:
  - arm: BOLT
    milestone: 5
    run_dir: runs/peptide_poc20_bolt_v2
    checkpoint_dir: runs/peptide_poc20_bolt_v2/checkpoints/BOLT-5/epoch_4
