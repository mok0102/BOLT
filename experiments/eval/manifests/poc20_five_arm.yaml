# file used to be "5-arm": BOLT/ORPT/ORPT-FA/ORPT-LEX/ORPT-DPO+II) were
# removed along with their implementations (superseded by the pool-level
# outcome-ranked ORPT method, see imp_plan/05_pool_orpt_phase1_plan.md) --
# still present on main-swhur-fa-orpt/other branches if needed. ORPT-DPO+II
# is kept as a legacy candidate-level baseline; its own eval was left
# incomplete (fixed_budget was never run) and is not being resumed here.
