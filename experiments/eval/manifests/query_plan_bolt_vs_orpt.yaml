# Query-plan domain, milestones [50,893,1138,1426] (matches
# query_plan_experiment/configs/query_plan_main.yaml, experiment_id
# query_plan_main_v1). BOLT rows only for now -- query_plan_experiment has no
# ORPT/DPO training pipeline at all yet (no orpt.py analog, no build_orpt
# flag), so the query-plan panel of fig:main-bo/fig:scaling/
# tab:main-bo-summary cannot show an ORPT curve until that trainer is built.
# ORPT-H1 rows are sketched below, commented out, ready to uncomment once
# that pipeline and its checkpoints exist -- no other change should be
# needed, since experiments/eval/domains.py's query_plan adapter is already
# generic over arm name.
#
# No query_plan training has happened at all yet (no runs/query_plan_main_v1
# directory on disk as of this writing) -- run
# `python -m query_plan_experiment.cli trajectory_chain --config
# query_plan_experiment/configs/query_plan_main.yaml` first.
