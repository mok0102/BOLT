# Config for the dpo_ii ablation recipe in ../dpo_ii/recipe.py: standard ORPT
# (stock torchtune.rlhf.loss.DPOLoss on feasible_only pairs, untouched) plus
# an additive infeasible-singles suppression term. Poc-scale (batch_size=32),
# used by the ORPT-DPO+II arm of the 5-arm poc20 comparison
# (peptide_poc20_orpt_dpo_ii.yaml), matching poc_qwen_2_5_3B_lora_dpo_bsz32.yaml
# (the plain-DPO arm's config) in every field except the two `ii_*` sections
# added below. See fine-tuning/peptides/dpo_ii/loss.py and
# /root/.claude/plans/orpt-orpt-fa-parsed-cray.md for the rationale.
#
# All *_dir / *_files / *.path fields below are placeholders: peptide_experiment's
# orpt.py always overrides them via CLI args, so this file is portable across
# machines and doesn't need editing directly.
#
# To launch on 1 device, run from repo root:
#   tune run --nnodes 1 --nproc_per_node 1 dpo_ii/recipe.py \
#       --config fine-tuning/peptides/torchtune_config/poc_qwen_2_5_3B_lora_dpo_ii_penalty.yaml

output_dir: ./output/qwen_2_5_3B_lora_dpo_ii_output  # overridden: output_dir=

# Model Arguments -- same LoRA hyperparameters as the other poc20 arms so the
# only thing that differs is the loss/dataset, not the adapter capacity.
model:
  _component_: torchtune.models.qwen2_5.lora_qwen2_5_3b
  lora_attn_modules: ['q_proj', 'v_proj', 'output_proj']
  apply_lora_to_mlp: True
  lora_rank: 4  # higher increases accuracy and memory
  lora_alpha: 8  # usually alpha=2*rank
  lora_dropout: 0.0

tokenizer:
  _component_: torchtune.models.qwen2_5.qwen2_5_tokenizer
  path: ./ckpt/Qwen2.5-3B-Instruct/vocab.json  # overridden: tokenizer.path=
  merges_file: ./ckpt/Qwen2.5-3B-Instruct/merges.txt  # overridden: tokenizer.merges_file=
  max_seq_len: null

# Main DPO dataset -- {"chosen": [...], "rejected": [...]} JSONL, exactly
# what make_dpo_train_data_csv.py's write_jsonl() emits for the default
# (feasible_only) pairing mode. Untouched from the plain-DPO poc20 config.
dataset:
  _component_: torchtune.datasets.preference_dataset
  source: json
  data_files: ./orpt_pairs/orpt_pairs.jsonl  # overridden: dataset.data_files=
  split: train
  train_on_input: false

# Infeasible-singles dataset -- {"messages": [...]} JSONL, exactly what
# ../make_infeasible_singles_csv.py emits (individually-sampled infeasible
# completions, no pairing). Same conversation format as the BOLT SFT stage's
# own dataset (qwen_2_5_3B_lora.yaml).
ii_dataset:
  _component_: torchtune.datasets.chat_dataset
  source: json
  data_files: ./orpt_pairs/orpt_infeasible_singles.jsonl  # overridden: ii_dataset.data_files=
  conversation_column: messages
  conversation_style: openai
  split: train
  train_on_input: false
ii_batch_size: 32  # overridden: ii_batch_size=  -- defaults to match batch_size below

checkpointer:
  # Overridden to that milestone's own BOLT-<m> checkpoint: this loads BOLT-<m>'s
  # weights as both pi_theta's initialization and (via the LoRA adapter-disable
  # trick in lora_dpo_distributed.py, reused unmodified by dpo_ii/recipe.py) the
  # frozen pi_ref -- no separate ref_checkpointer needed.
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: ./ckpt/Qwen2.5-3B-Instruct  # overridden: checkpointer.checkpoint_dir=
  checkpoint_files: [
    model-00001-of-00002.safetensors,
    model-00002-of-00002.safetensors,
  ]
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: QWEN2
resume_from_checkpoint: False
save_adapter_weights_only: False

# Fine-tuning arguments
seed: 42
shuffle: true
batch_size: 32
epochs: 1  # separate knob from sft_epochs (cfg.orpt_epochs)
optimizer:
  _component_: torch.optim.AdamW
  fused: True
  weight_decay: 0.01
  lr: 3e-4
lr_scheduler:
  _component_: torchtune.training.lr_schedulers.get_cosine_schedule_with_warmup
  num_warmup_steps: 20
# Untouched stock DPOLoss -- same as plain ORPT (poc_qwen_2_5_3B_lora_dpo_bsz32.yaml).
loss:
  _component_: torchtune.rlhf.loss.DPOLoss
  beta: 0.1  # overridden: loss.beta=
  label_smoothing: 0
# Additive infeasible-singles suppression term (dpo_ii/loss.py) -- reuses
# FA-ORPT's own gamma_i/lambda_inf defaults for an identical suppression
# strength.
ii_loss:
  _component_: dpo_ii.loss.InfeasibleSuppressionLoss
  gamma_i: 0.5     # overridden: ii_loss.gamma_i=
  lambda_inf: 1.0  # overridden: ii_loss.lambda_inf=
max_steps_per_epoch: null
gradient_accumulation_steps: 1
compile: False

# Training env
device: cuda

# Memory management
enable_activation_checkpointing: True
enable_activation_offloading: True

# Reduced precision
dtype: bf16

# Logging
metric_logger:
  _component_: torchtune.training.metric_logging.TensorBoardLogger
  log_dir: ./tensorboard  # overridden: metric_logger.log_dir=
  organize_logs: True
log_every_n_steps: 1
log_peak_memory_stats: False
