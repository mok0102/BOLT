# Config for the fa_orpt (feasibility-aware ORPT) recipe in ../fa_orpt/recipe.py,
# using a Qwen2.5 3B model, applied on top of an already-built BOLT-<m> SFT
# checkpoint -- same "ranking/fine-tuning stage" role as
# qwen_2_5_3B_lora_dpo.yaml, just with the fa_orpt dataset/loss instead of
# the stock DPO ones. See fa_orpt/loss.py and
# imp_plan/04_orpt_future_plan.md's 2026-07-22 entry for the rationale.
#
# All *_dir / *_files / *.path fields below are placeholders: peptide_experiment's
# orpt.py always overrides them via CLI args, so this file is portable across
# machines and doesn't need editing directly.
#
# To launch on 1 device, run from repo root:
#   tune run --nnodes 1 --nproc_per_node 1 fa_orpt/recipe.py \
#       --config fine-tuning/peptides/torchtune_config/qwen_2_5_3B_lora_fa_orpt.yaml

output_dir: ./output/qwen_2_5_3B_lora_fa_orpt_output  # overridden: output_dir=

# Model Arguments -- same LoRA hyperparameters as qwen_2_5_3B_lora.yaml /
# qwen_2_5_3B_lora_dpo.yaml so the only thing that differs between the DPO
# and fa_orpt ORPT arms is the loss/dataset, not the adapter capacity.
model:
  _component_: torchtune.models.qwen2_5.lora_qwen2_5_3b
  lora_attn_modules: ['q_proj', 'v_proj', 'output_proj']
  apply_lora_to_mlp: True
  lora_rank: 8  # higher increases accuracy and memory
  lora_alpha: 16  # usually alpha=2*rank
  lora_dropout: 0.0

tokenizer:
  _component_: torchtune.models.qwen2_5.qwen2_5_tokenizer
  path: ./ckpt/Qwen2.5-3B-Instruct/vocab.json  # overridden: tokenizer.path=
  merges_file: ./ckpt/Qwen2.5-3B-Instruct/merges.txt  # overridden: tokenizer.merges_file=
  max_seq_len: null

# Dataset -- {"chosen": [...], "rejected": [...], "chosen_feasible": 0|1,
# "rejected_feasible": 0|1} JSONL, exactly what make_dpo_train_data_csv.py's
# write_jsonl() emits when built with --pairing-mode feasibility_aware.
dataset:
  _component_: fa_orpt.dataset.feasibility_aware_preference_dataset
  source: json
  data_files: ./orpt_pairs/orpt_pairs.jsonl  # overridden: dataset.data_files=
  split: train
  train_on_input: false

checkpointer:
  # Overridden to that milestone's own BOLT-<m> checkpoint: this loads BOLT-<m>'s
  # weights as both pi_theta's initialization and (via the LoRA adapter-disable
  # trick in lora_dpo_distributed.py, reused unmodified by fa_orpt/recipe.py) the
  # frozen pi_ref -- no separate ref_checkpointer needed.
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: ./ckpt/Qwen2.5-3B-Instruct  # overridden: checkpointer.checkpoint_dir=
  checkpoint_files: [
    model-00001-of-00002.safetensors,
    model-00002-of-00002.safetensors,
  ]
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: QWEN2
resume_from_checkpoint: False
save_adapter_weights_only: False

# Fine-tuning arguments
seed: 42
shuffle: true
batch_size: 4
epochs: 1  # separate knob from sft_epochs (cfg.orpt_epochs)
optimizer:
  _component_: torch.optim.AdamW
  fused: True
  weight_decay: 0.01
  lr: 3e-4
lr_scheduler:
  _component_: torchtune.training.lr_schedulers.get_cosine_schedule_with_warmup
  num_warmup_steps: 20
loss:
  _component_: fa_orpt.loss.FeasibilityAwareORPTLoss
  beta: 0.1  # overridden: loss.beta=  (same role as DPOLoss.beta: feasible-vs-feasible ranking temperature)
  gamma_obj: 0.0  # overridden: loss.gamma_obj=
  gamma_plus: 0.0  # overridden: loss.gamma_plus=
  gamma_keep: -0.1  # overridden: loss.gamma_keep=
  lambda_up: 0.2  # overridden: loss.lambda_up=
  lambda_keep: 0.2  # overridden: loss.lambda_keep=
  gamma_f: 0.0  # overridden: loss.gamma_f=
  gamma_i: 0.5  # overridden: loss.gamma_i=
  lambda_inf: 1.0  # overridden: loss.lambda_inf=
  # Guards against per-branch class imbalance (real trajectory data is only
  # ~5-10% feasible; batch_size below is small enough that even a rebalanced
  # pairs pool -- see make_dpo_train_data_csv.py's
  # DEFAULT_FEASIBILITY_AWARE_PAIR_TYPE_MIX -- can still yield a lopsided
  # single batch) by weighing each present branch equally rather than each
  # example equally. See fa_orpt/loss.py's docstring. Set to False for the
  # literal per-example-mean formula instead.
  normalize_by_branch: true
max_steps_per_epoch: null
gradient_accumulation_steps: 1
compile: False

# Training env
device: cuda

# Memory management
enable_activation_checkpointing: True
enable_activation_offloading: True

# Reduced precision
dtype: bf16

# Logging
metric_logger:
  _component_: torchtune.training.metric_logging.TensorBoardLogger
  log_dir: ./tensorboard  # overridden: metric_logger.log_dir=
  organize_logs: True
log_every_n_steps: 1
log_peak_memory_stats: False
