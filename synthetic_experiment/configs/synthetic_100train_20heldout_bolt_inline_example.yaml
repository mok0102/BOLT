# Independent BOLT-only trajectory chain corresponding to
# synthetic_100train_20heldout_inline_example.yaml. It deliberately uses a
# separate experiment_id/run directory because the BOLT and ORPT chains begin
# to generate different task trajectories after the first milestone.
experiment_id: synthetic_branin_50train_20heldout_bolt_v2 ### v2 chosen>rejected 포함
milestones: [2, 5, 10, 20, 30, 40, 50]
num_train_tasks: 50
num_heldout_tasks: 20

train_task_t_override: [0.005, 0.025, 0.045, 0.065, 0.085, 0.105, 0.125, 0.145, 0.165, 0.185, 0.205, 0.225, 0.245, 0.265, 0.285, 0.305, 0.325, 0.345, 0.365, 0.385, 0.405, 0.425, 0.445, 0.465, 0.485, 0.505, 0.525, 0.545, 0.565, 0.585, 0.605, 0.625, 0.645, 0.665, 0.685, 0.705, 0.725, 0.745, 0.765, 0.785, 0.805, 0.825, 0.845, 0.865, 0.885, 0.905, 0.925, 0.945, 0.965, 0.985]
heldout_task_t_override: [0.00, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]

oracle_budget: 500
init_size: 100
bsz: 10
bo_seed: 42
bo_candidate_pool_size: 128
trajectory_parallel_workers: 2
table_k_checkpoints: [2, 5, 10, 20, 50, 100]

proposal_source: llm
sampling_temperature: 1
sft_top_n_per_task: 1000
sft_epochs: 5
torchtune_config: qwen_2_5_3B_lora.yaml
torchtune_recipe: lora_finetune_distributed
base_checkpoint_dir: fine-tuning/query_plans/ckpt/Qwen2.5-3B-Instruct
cuda_visible_devices: "0,1"

build_orpt: false
