# Main experiment (paper-fidelity scale), BOLT-only arm -- v2 milestone
# schedule, superseding peptide_main_bolt.yaml's [126,252,378,504,630,756,900]
# 900-task-pool schedule for this round. milestones/table_k_checkpoints given
# directly by the user this session (not yet trained anywhere -- verify
# checkpoints exist under runs/peptide_main_bolt_v2/checkpoints/BOLT-<m>
# before assuming this schedule has been run). A new experiment_id/run_dir is
# used rather than editing peptide_main_bolt.yaml in place, so the
# already-completed [126..900] run and its results/ aren't orphaned.
#
# Also the shared run_dir any MTBO-<m>/OptFormer-<m>/GP-expert-transfer
# baselines for this schedule would be trained into (see
# peptide_experiment/{mtbo,optformer,gp_expert_transfer}.py) -- none of that
# training has happened yet either; experiments/eval/manifests/
# main_v2_orpt_vs_bolt.yaml lists those rows commented out until it does.
#
# oracle_budget/init_size/bsz/sft_epochs/similarity_threshold/torchtune_config
# unchanged from peptide_main_bolt.yaml (same paper-fidelity scale, only the
# milestone schedule and reported k-checkpoints differ).
experiment_id: peptide_main_bolt_v2
milestones: [10, 20, 50, 250, 400, 500, 600]
oracle_budget: 20000
init_size: 1000
bsz: 50
sft_epochs: 5
similarity_threshold: 0.75
build_orpt: false
build_mtbo: true
build_optformer: true
torchtune_config: main_qwen_2_5_3B_lora_bsz32.yaml

# Few-shot/init-only reporting checkpoints for this round (paper's fig:fewshot
# few-shot-proposal-quality axis and fig:scaling's init-only panel) -- given
# directly by the user this session, replacing the dataclass's own
# [1,100,200,500,1000] default (left untouched globally so every
# already-completed peptide run keeps its existing behavior).
table_k_checkpoints: [20, 50, 100, 200, 500, 1000]

# cuda_visible_devices: check nvidia-smi fresh at launch time -- do not
# assume any specific id is still free (shared machine).
cuda_visible_devices: null
