# Clean full re-run (BO collection + SFT + fa_orpt) at batch_size=32 for both
# the SFT stage (qwen_2_5_3B_lora_bsz32.yaml) and the fa_orpt stage
# (qwen_2_5_3B_lora_fa_orpt.yaml), vs peptide_100task_orpt_fa's batch_size=4.
#
# Deliberately NOT reusing peptide_100task_bolt_v1's trajectories/checkpoints
# via symlink: trajectory_chain.py's checkpoint_to_sample_from() samples every
# task from milestone 14 onward from the previous milestone's own trained
# checkpoint (ORPT-<m>, since build_orpt: true), so a different SFT
# batch_size -> different BOLT-<m>/ORPT-<m> weights -> different BO
# initialization pools -> different trajectories for tasks 14-99. Only tasks
# 0-13 (build_mutation_init, model-independent) would have been identical to
# the old run. See peptide_experiment/trajectory_chain.py.
#
# cuda_visible_devices intentionally left unset -- launch with
# CUDA_VISIBLE_DEVICES=<gpu> so this file doesn't need editing per GPU choice.
experiment_id: peptide_100task_bolt_orpt_fa_bsz32
milestones: [14, 28, 42, 56, 70, 84, 100]
oracle_budget: 5000
init_size: 500
bsz: 50
sft_epochs: 5
similarity_threshold: 0.75
torchtune_config: qwen_2_5_3B_lora_bsz32.yaml
build_orpt: true
orpt_epochs: 1
orpt_pairs_per_task: 1000
orpt_beta: 0.25
orpt_lr: 2.0e-5
orpt_pairing_mode: feasibility_aware
orpt_loss_type: fa_orpt
orpt_torchtune_recipe: fa_orpt/recipe.py
orpt_torchtune_config: qwen_2_5_3B_lora_fa_orpt.yaml
