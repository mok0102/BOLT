# Ablation Study (paper/experiments.tex sec:ablations), "Zero-step outcome
# ranking" arm -- identical to peptide_main_orpt_h1.yaml except mi_bo_steps=0:
# pairs are labeled purely by the two candidates' own pre-rollout y (H0,
# mi_orpt/one_step_evaluator.py::zero_step_utility), no real one-step BO
# call, no additional oracle cost. mi_require_h0 is left at its default
# (true) but is VACUOUS here -- at mi_bo_steps=0, Delta_0 == y_new - y_old
# by construction, so the H0 gate and the sign(Delta_0) comparison it gates
# always agree; nothing is ever dropped by it. See paper/experiments.tex's
# U_0(C,S) equation.
#
# Same milestones, oracle_budget, init_size, and (critically)
# mi_num_backgrounds/mi_background_size/mi_target_pairs_per_task/
# mi_max_candidates_per_task/mi_max_tasks_per_milestone as
# peptide_main_orpt_h1.yaml -- must match exactly, otherwise Zero-step vs.
# One-step wouldn't be a controlled comparison (differing pair-construction
# budgets would confound the ablation's own signal). mi_num_backgrounds=8/
# mi_background_size=20/mi_max_candidates_per_task=24 (2026-09, up from
# 4/unset/16) mirror peptide_main_orpt_h1.yaml's own diagnostic-session fix
# for real milestone-600 pair-yield collapse -- see that config's comment
# for the full root-cause writeup; it applies here too since the shared
# base-set/bank-size-gate code path doesn't branch on mi_bo_steps.
# mi_max_tasks_per_milestone is also removed here (2026-09-23), same as
# peptide_main_orpt_h1.yaml -- every task in [0, milestone) is now used for
# pair construction at every milestone, not a fixed 50-task subsample. No
# heldout_tasks_override: uses the real heldout
# task set, same as the main experiment, so this arm's eval work is directly
# comparable to -- and BOLT/ORPT-H1's rows are directly reused from -- the
# main experiment's own eval run.
#
# mi_parallel_gpus=[0..3]: shares peptide_main_bolt.yaml's 4-GPU slice, NOT
# peptide_main_orpt_h1.yaml's [4..7] -- runs sequentially after that arm's
# own chain finishes (both being independent experiment_ids/trajectory
# chains, this is a GPU-scheduling choice only, not a data dependency), so
# this ablation's DPO-heavy workload gets its own free 4-GPU slice rather
# than waiting for ORPT-H1's full multi-day chain to finish too. See
# experiments/eval2/pipelines/run_train.sh's header for the full
# concurrent-pipeline layout. cuda_visible_devices="0" pins the per-task BO
# trajectory-sampling calls (see peptide_main_bolt.yaml's own comment for
# why "0" specifically, not a round-robin across 0-3). Check nvidia-smi
# fresh at launch time regardless -- do not assume these ids are still free
# (shared machine).
experiment_id: peptide_ablation_orpt_h0
milestones: [10, 20, 50, 250, 400, 500, 600]
mi_parallel_gpus: ["0", "1", "2", "3"]
cuda_visible_devices: "0"
oracle_budget: 500
init_size: 100
bsz: 50
sft_epochs: 5
similarity_threshold: 0.75
torchtune_config: main_qwen_2_5_3B_lora_bsz32_rank16.yaml
build_orpt: true
orpt_epochs: 1
orpt_beta: 0.25
orpt_lr: 2.0e-5
orpt_torchtune_config: main_qwen_2_5_3B_lora_dpo_bsz32_rank16.yaml
orpt_pair_source: matched_intervention
mi_num_backgrounds: 8
mi_background_size: 20
mi_tau_q: 1.0
mi_z_min: 1.0
mi_delta_t: 0.0
mi_target_pairs_per_task: 30
mi_max_candidates_per_task: 24
mi_bo_steps: 0
# mi_candidate_temperature/mi_candidate_pool_size: must match
# peptide_main_orpt_h1.yaml exactly -- see that config's identical comment
# for why these are set (bank-starvation at this budget scale, the real
# ~10% feasible-candidate rate measured against BOLT-10, unrelated to
# bo_steps).
mi_candidate_temperature: 1.5
mi_candidate_pool_size: 2000

table_k_checkpoints: [20, 50, 100, 200, 500]
