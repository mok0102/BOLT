# Paper-fidelity peptide config (Table 11 + Figure 1/2 milestones).
experiment_id: peptide_main_v1
milestones: [10, 20, 50, 600]
oracle_budget: 20000
init_size: 1000
bsz: 50
sft_epochs: 5
similarity_threshold: 0.75

# -- everything below is left at ExperimentConfig's default value; spelled
# out explicitly here so every configurable key is visible in one place --

task_specific_args: bacteria_0                # only supported value -- your_objective_functions.py asserts 0 on anything else
torchtune_config: qwen_2_5_3B_lora.yaml       # alternatives in fine-tuning/peptides/torchtune_config/: qwen_2_5_3B_full.yaml, qwen_2_5_7B_full.yaml
torchtune_recipe: lora_finetune_distributed   # pair qwen_2_5_3B_full.yaml/qwen_2_5_7B_full.yaml with full_finetune_distributed instead
base_checkpoint_dir: fine-tuning/peptides/ckpt/Qwen2.5-3B-Instruct
max_train_tasks: null         # null -> max(milestones)
cuda_visible_devices: null    # null -> don't pin a GPU; check availability before setting
heldout_tasks_override: null  # null -> use the real paper heldout20/heldout100 splits
table_k_checkpoints: [1, 100, 200, 500, 1000]

# ORPT (Stage 4) -- off by default; this is a BOLT-only paper-fidelity config.
build_orpt: false
orpt_epochs: 1
orpt_pairs_per_task: 1000
orpt_infeasible_singles_per_task: 1000  # dpo_ii_penalty loss_type only -- see below
orpt_beta: 0.1
orpt_lr: 3.0e-4
orpt_pairing_mode: feasible_only  # only supported mode -- lexicographic/feasibility_aware were removed with ORPT-LEX/ORPT-FA, see imp_plan/05_pool_orpt_phase1_plan.md
orpt_torchtune_config: qwen_2_5_3B_lora_dpo.yaml     # alternative: qwen_2_5_3B_dpo.yaml (full DPO, not LoRA); dpo_ii_penalty loss_type needs poc_qwen_2_5_3B_lora_dpo_ii_penalty.yaml instead
orpt_torchtune_recipe: lora_dpo_distributed          # pair qwen_2_5_3B_dpo.yaml with full_dpo_distributed instead; dpo_ii_penalty loss_type needs dpo_ii/recipe.py instead

# dpo_ii_penalty (additive infeasible-suppression ablation) -- off by default
# (orpt_loss_type: dpo, the DPOLoss-based loss above). Set orpt_loss_type:
# dpo_ii_penalty + orpt_torchtune_config: poc_qwen_2_5_3B_lora_dpo_ii_penalty.yaml
# + orpt_torchtune_recipe: dpo_ii/recipe.py together to switch arms -- see
# fine-tuning/peptides/dpo_ii/loss.py and peptide_poc20_orpt_dpo_ii.yaml.
orpt_loss_type: dpo  # alternative: dpo_ii_penalty
fa_orpt_gamma_i: 0.5      # dpo_ii_penalty only
fa_orpt_lambda_inf: 1.0   # dpo_ii_penalty only

# Matched-intervention ORPT (paper/method.tex, paper/appendix.tex -- actual
# one-step BO evaluator) -- off by default (orpt_pair_source:
# objective_ranked, the raw-score pairing above). Set orpt_pair_source:
# matched_intervention to label pairs via a real one-step BO evaluation
# instead; pool size m reuses init_size above, but pair count is its own
# mi_target_pairs_per_task/mi_max_pair_attempts_per_task fields rather than
# orpt_pairs_per_task -- unlike objective_ranked's sample_pairs() (which
# always reaches exactly orpt_pairs_per_task pairs), matched_intervention's
# reliability filter can reject any given candidate, so a fixed proposal
# count wouldn't tell you the actual training-pair yield from the config
# alone.
orpt_pair_source: objective_ranked  # alternative: matched_intervention
mi_num_backgrounds: 8    # M -- matched_intervention only
mi_tau_q: 1.0              # reference-aligned distribution temperature -- matched_intervention only
mi_z_min: 1.96             # SNR reliability threshold -- matched_intervention only
mi_delta_t: 0.0            # min |Delta_1|, numerical tolerance only -- matched_intervention only
mi_target_pairs_per_task: 5      # stop once this many reliable pairs are found for a task -- matched_intervention only
mi_max_pair_attempts_per_task: 20  # give up after this many candidate pairs tried, even short of target -- matched_intervention only
mi_bo_steps: 1              # 1 = actual one-step BO (real oracle calls); 0 = zero-step ablation -- matched_intervention only
