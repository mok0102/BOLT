# Smoke config for the dpo_ii ablation (standard ORPT DPO loss + additive
# infeasible-singles suppression term), added for the legacy-regression check
# in imp_plan/05_pool_orpt_phase1_plan.md -- confirms the fa_orpt cleanup
# (removal of ORPT-FA/ORPT-LEX) didn't disturb the dpo_ii_penalty code path,
# which shares config.py's fa_orpt_gamma_i/fa_orpt_lambda_inf fields.
#
# Deliberately a NEW experiment_id (not reusing peptide_smoke_v1/
# peptide_smoke_orpt_v1): same reasoning as peptide_smoke_orpt.yaml's header
# -- a fresh trajectory chain is needed to exercise checkpoint_to_sample_from's
# ORPT-branch from milestone 1 onward.
#
# orpt_pairs_per_task/orpt_infeasible_singles_per_task are 40 (not
# peptide_smoke_orpt.yaml's 20) because dpo_ii/recipe.py's dataloaders both
# use drop_last=True at batch_size=32 (from poc_qwen_2_5_3B_lora_dpo_ii_penalty.yaml,
# reused as-is) -- fewer than 32 pairs/singles would drop the only batch and
# never exercise the training loop at all.
experiment_id: peptide_smoke_dpo_ii_v1
milestones: [1, 2, 3]
oracle_budget: 200
init_size: 20
bsz: 10
sft_epochs: 1
similarity_threshold: 0.75
heldout_tasks_override: [900, 901]
table_k_checkpoints: [1, 50, 100, 150, 200]
cuda_visible_devices: "5"
build_orpt: true
orpt_epochs: 1
orpt_pairs_per_task: 40
orpt_infeasible_singles_per_task: 40
orpt_loss_type: dpo_ii_penalty
orpt_torchtune_recipe: dpo_ii/recipe.py
orpt_torchtune_config: poc_qwen_2_5_3B_lora_dpo_ii_penalty.yaml
fa_orpt_gamma_i: 0.5
fa_orpt_lambda_inf: 1.0
