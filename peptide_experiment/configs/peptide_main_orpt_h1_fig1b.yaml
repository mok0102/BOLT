# fig:main-bo (paper-style, Figure 1b reproduction with ORPT added) -- see
# peptide_main_bolt_fig1b.yaml's comment. Points at the existing
# runs/lorarank_8/peptide_main_orpt_h1 run_dir (arm name ORPT-H1, distinct
# from ORPT-MI -- see arm_specs/fig1b.yaml and figures/labels.py, which maps
# both to the paper's single "ORPT" label). Own experiment_id
# (lorarank_8_orpt_h1_fig1b, matched by a same-named runs/ symlink to
# lorarank_8/peptide_main_orpt_h1) so this eval run's own state (e.g. LOLBO's
# optimization_all_collected_data/<experiment_id>.csv) never collides with
# peptide_main_orpt_mi_fig1b.yaml's. Deliberately NOT reusing that file's
# experiment_id/run_dir -- doing so would make fixed_target_bo.py resolve
# ORPT-H1's raw/BO output dirs under the MI run_dir instead of this one,
# silently mixing the two arms' eval state (see arm_specs/fig1b.yaml's
# comment on the two ORPT-* entries for the full reasoning).
#
# No orpt.py/mi_orpt training fields needed -- this config is only used for
# fixed_target_bo.py's eval-time real BO, never pair construction.
experiment_id: lorarank_8_orpt_h1_fig1b
milestones: [126, 252, 378, 504, 630, 756, 900]
oracle_budget: 20000
init_size: 1000
bsz: 50
sft_epochs: 5
similarity_threshold: 0.75
build_orpt: true
torchtune_config: main_qwen_2_5_3B_lora_bsz32_rank16.yaml
table_k_checkpoints: [20, 50, 100, 200, 500]

# ORPT-H1's raw generations plateaued well short of fixed_target_bo's
# target_pool_size=1000 at later milestones even after 5 retries at the
# sampling_transformers.py default temperature (e.g. milestone=900 median
# only ~305 unique/feasible candidates found) -- see config.py's own comment
# on these two fields. Starts retries at 1.5 instead of the default ~1.0,
# +0.5 per successive attempt (1.5/2.0/2.5/3.0/3.5 across the 5 attempts).
eval_raw_temperature: 1.5
eval_raw_temperature_step: 0.5
