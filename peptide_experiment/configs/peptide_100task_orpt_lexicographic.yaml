# Constraint-aware ORPT variant: same beta=0.25/lr=2e-5/epoch=1 as
# peptide_100task_orpt_beta0.25.yaml, but with orpt_pairing_mode:
# lexicographic instead of the default feasible_only. Preference pairs are
# built by ranking similarity-constraint feasibility *ahead of* objective
# score (see make_dpo_train_data_csv.py's sample_pairs()/
# _pick_chosen_rejected() docstrings), instead of dropping infeasible
# candidates and ranking purely by score. This is a single-pass fix (no
# separate self-generated-negative-mining round, no forgetting risk from
# sequential fine-tuning) made possible by the empirical finding that raw BO
# trajectory data already contains abundant infeasible candidates (~90-95%
# of all rows per experiments/constraint_violation/ notes) that
# feasible_only mode was simply discarding.
#
# Reuses peptide_100task_bolt_v1's already-completed BOLT-<m> checkpoints and
# trajectory data via symlinks into this experiment_id's run_dir, same as
# peptide_100task_orpt_beta0.25.yaml, so only build_orpt_pairs +
# train_orpt_milestone need to run (no SFT/BO re-run). oracle_budget/
# init_size/bsz are unused by that path but required by ExperimentConfig,
# kept identical to peptide_100task_bolt_v1 for consistency.
experiment_id: peptide_100task_orpt_lexicographic
milestones: [14, 28, 42, 56, 70, 84, 100]
oracle_budget: 5000
init_size: 500
bsz: 50
sft_epochs: 5
similarity_threshold: 0.75
build_orpt: true
orpt_epochs: 1
orpt_pairs_per_task: 1000
orpt_beta: 0.25
orpt_lr: 2e-5
orpt_pairing_mode: lexicographic
cuda_visible_devices: "1"
