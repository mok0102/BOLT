# Ad hoc sanity check: paper-fidelity budgets (not the smoke config's toy
# scale), but capped to 2 training tasks, to confirm the actual BO
# optimization trajectory looks sensible at real scale before committing to
# the full 600-task run.
experiment_id: peptide_2task_check_v1
milestones: [1]
oracle_budget: 20000
init_size: 1000
bsz: 50
sft_epochs: 5
similarity_threshold: 0.75
max_train_tasks: 2
heldout_tasks_override: [900, 901]
cuda_visible_devices: "5"
