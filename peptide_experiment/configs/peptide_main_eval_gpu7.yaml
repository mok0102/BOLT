# GPU-7-pinned pointer config for experiments/eval/ scripts run against
# main_bolt_vs_orpt_mi.yaml's gpu7 shard (POGPE/SGPE/LLAMBO -- the
# milestone-independent baselines). Only cuda_visible_devices differs from
# peptide_main_eval_gpu0.yaml -- every other field is read-only
# shared-constants, same as every other gpu{0-6} pointer config.
# cuda_visible_devices: check nvidia-smi fresh at launch time -- do not
# assume this value is still free (shared machine).
experiment_id: peptide_main_bolt
milestones: [126, 252, 378, 504, 630, 756, 900]
cuda_visible_devices: "7"
oracle_budget: 20000
init_size: 1000
bsz: 50
sft_epochs: 5
similarity_threshold: 0.75
build_orpt: false
