# 4-arm PoC (BOLT / ORPT / ORPT-LEX / ORPT-FA) -- BOLT (SFT-only) arm.
#
# Deliberately NOT symlinked to/from the other 3 PoC configs
# (peptide_poc20_{orpt,orpt_lex,orpt_fa}.yaml): trajectory_chain.py's
# checkpoint_to_sample_from() samples every task past the first milestone
# from that arm's own latest checkpoint (ORPT-<m> instead of BOLT-<m> once
# build_orpt: true), so each arm's cumulative trajectory data genuinely
# diverges from milestone 2 onward -- reusing another arm's trajectories via
# symlink would silently skip that self-reinforcing sampling and defeat the
# point of this comparison (see peptide_100task_bolt_orpt_fa_bsz32.yaml for
# the same reasoning applied to a different experiment). Each of the 4 PoC
# arms therefore runs its own fully independent trajectory_chain from task 0.
#
# Mid-scale compute (between peptide_smoke.yaml's oracle_budget=200/
# init_size=20/bsz=10/sft_epochs=1 and the real 100-task configs'
# oracle_budget=5000/init_size=500/bsz=50/sft_epochs=5): sft_epochs=3 since
# each milestone's SFT dataset is tiny at only 10-20 tasks' worth of
# trajectories, so extra epochs are cheap.
#
# heldout_tasks_override: first 5 of HELDOUT20_TASKS (900-919), extending
# peptide_smoke.yaml's [900, 901] convention, for a faster PoC turnaround
# than the full 20-task heldout20 sweep.
#
# cuda_visible_devices intentionally left unset -- GPU availability on this
# shared box is volatile; check `nvidia-smi` fresh before launching and pass
# CUDA_VISIBLE_DEVICES=<n> as a shell env-var prefix instead.
experiment_id: peptide_poc20_bolt
milestones: [5, 10, 20]
oracle_budget: 5000
init_size: 500
bsz: 50
sft_epochs: 5
similarity_threshold: 0.75
heldout_tasks_override: [900, 901, 902, 903, 904]
torchtune_config: poc_qwen_2_5_3B_lora_bsz32.yaml  # batch_size=32 across all 4 PoC arms
build_orpt: false
